name: Quality checks

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reject tracked environment files
        run: |
          if git ls-files | grep -E "(^|/)\.env$"; then
            echo "Tracked .env files are not allowed. Use .env.example instead."
            exit 1
          fi
      - name: Install dependencies
        run: npm install --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm test
